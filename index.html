    
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clon de Netflix - Proyecto Educativo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Barra de navegación -->
  <header class="nav" id="nav">
    <img src="https://upload.wikimedia.org/wikipedia/commons/0/08/Netflix_2015_logo.svg" alt="Netflix Logo" class="nav__logo">
    <div class="nav__avatar">
      <img src="https://upload.wikimedia.org/wikipedia/commons/0/0b/Netflix-avatar.png" alt="Usuario" class="avatar_img">
    </div>
  </header>

  <!-- Banner principal (Hero) -->
  <section class="banner" id="banner">
    <div class="banner__contents">
      <h1 class="banner__title" id="banner-title">Cargando película...</h1>
      <div class="banner__buttons">
        <button class="banner__button">Reproducir</button>
        <button class="banner__button">Mi Lista</button>
      </div>
      <p class="banner__description" id="banner-description"></p>
    </div>
    <div class="banner--fadeBottom"></div>
  </section>

  <!-- Contenedores de carruseles -->
  <main class="rows-container">
    <div class="row">
      <h2>Tendencias en Netflix</h2>
      <div class="row__posters" id="row-trending"></div>
    </div>
    <div class="row">
      <h2>Populares</h2>
      <div class="row__posters" id="row-popular"></div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
